name: Clone Traffic Monitor

on:
  schedule:
    # 毎週月曜 09:00 JST (日曜 00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    # Gaku52のみ実行可能
    if: |
      github.repository_owner == 'Gaku52' &&
      (github.actor == 'Gaku52' || github.event_name == 'schedule')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check clone traffic
        id: traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          # クローンデータ取得（過去14日間）
          CLONES_JSON=$(gh api repos/${{ github.repository }}/traffic/clones)
          VIEWS_JSON=$(gh api repos/${{ github.repository }}/traffic/views)

          CLONE_COUNT=$(echo "$CLONES_JSON" | jq '.count')
          CLONE_UNIQUES=$(echo "$CLONES_JSON" | jq '.uniques')
          VIEW_COUNT=$(echo "$VIEWS_JSON" | jq '.count')
          VIEW_UNIQUES=$(echo "$VIEWS_JSON" | jq '.uniques')

          # 日別クローン数の最大値
          PEAK_DAY=$(echo "$CLONES_JSON" | jq -r '[.clones[] | {date: .timestamp[:10], count: .count}] | sort_by(-.count) | .[0] | "\(.date) (\(.count) clones)"')

          echo "clone_count=$CLONE_COUNT" >> $GITHUB_OUTPUT
          echo "clone_uniques=$CLONE_UNIQUES" >> $GITHUB_OUTPUT
          echo "view_count=$VIEW_COUNT" >> $GITHUB_OUTPUT
          echo "view_uniques=$VIEW_UNIQUES" >> $GITHUB_OUTPUT
          echo "peak_day=$PEAK_DAY" >> $GITHUB_OUTPUT

          # 異常判定: ユニーククローン100以上 or クローン/ビュー比率が10倍以上
          ALERT=false
          if [ "$CLONE_UNIQUES" -gt 100 ]; then
            ALERT=true
            echo "alert_reason=Unique clones exceeded 100 ($CLONE_UNIQUES)" >> $GITHUB_OUTPUT
          elif [ "$VIEW_UNIQUES" -gt 0 ] && [ "$CLONE_UNIQUES" -gt "$(( VIEW_UNIQUES * 10 ))" ]; then
            ALERT=true
            echo "alert_reason=Clone/View ratio anomaly (${CLONE_UNIQUES} clones vs ${VIEW_UNIQUES} views)" >> $GITHUB_OUTPUT
          fi
          echo "alert=$ALERT" >> $GITHUB_OUTPUT

      - name: Create alert issue
        if: steps.traffic.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLONE_COUNT: ${{ steps.traffic.outputs.clone_count }}
          CLONE_UNIQUES: ${{ steps.traffic.outputs.clone_uniques }}
          VIEW_COUNT: ${{ steps.traffic.outputs.view_count }}
          VIEW_UNIQUES: ${{ steps.traffic.outputs.view_uniques }}
          PEAK_DAY: ${{ steps.traffic.outputs.peak_day }}
          ALERT_REASON: ${{ steps.traffic.outputs.alert_reason }}
        run: |
          gh issue create \
            --title "Clone traffic alert (${CLONE_UNIQUES} unique clones in 14 days)" \
            --label "security" \
            --body "## Clone Traffic Alert

          **Reason:** ${ALERT_REASON}

          ### Traffic Summary (past 14 days)

          | Metric | Total | Unique |
          |--------|-------|--------|
          | Clones | ${CLONE_COUNT} | ${CLONE_UNIQUES} |
          | Views | ${VIEW_COUNT} | ${VIEW_UNIQUES} |

          **Peak day:** ${PEAK_DAY}

          ### Recommended Actions

          - [ ] Check referrer sources: \`gh api repos/${GITHUB_REPOSITORY}/traffic/popular/referrers\`
          - [ ] Review if any new external links point to this repo
          - [ ] Consider if bot/scraper activity is increasing
          - [ ] Check if any sensitive information was recently committed

          ---
          Auto-generated by clone-monitor.yml"

      - name: Summary
        env:
          CLONE_COUNT: ${{ steps.traffic.outputs.clone_count }}
          CLONE_UNIQUES: ${{ steps.traffic.outputs.clone_uniques }}
          VIEW_COUNT: ${{ steps.traffic.outputs.view_count }}
          VIEW_UNIQUES: ${{ steps.traffic.outputs.view_uniques }}
          PEAK_DAY: ${{ steps.traffic.outputs.peak_day }}
          ALERT: ${{ steps.traffic.outputs.alert }}
        run: |
          echo "### Clone Traffic Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Total | Unique |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Clones | $CLONE_COUNT | $CLONE_UNIQUES |" >> $GITHUB_STEP_SUMMARY
          echo "| Views | $VIEW_COUNT | $VIEW_UNIQUES |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Peak day:** $PEAK_DAY" >> $GITHUB_STEP_SUMMARY
          if [ "$ALERT" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**ALERT: Anomalous traffic detected. Issue created.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Traffic within normal range." >> $GITHUB_STEP_SUMMARY
          fi
